name: PHP Package
on:
  push:
  pull_request:
  workflow_call:
jobs:
  static:
    name: Check Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
      - run: composer install
        shell: bash
      - run: composer static
        shell: bash
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
      - run: composer install
        shell: bash
      - run: composer test
        shell: bash
